<div class="header">
  <h1>Welcome to Aura Clicker</h1>
</div>
<div id="page-content">
  <div class="info-area">
    <div class="info-row">
      <span>Level: <span id="levelName">Novice Soul</span> (<span id="level">1</span>)</span>
      <span>Energy: <span id="energy">500</span></span>
    </div>
    <div class="progress">
      <div id="levelProgress" class="progress-bar level-progress"></div>
    </div>
    <div class="info-row">
      <span>Coins: <span id="coins">0</span></span>
      <span>Tap power: <span id="tapPower">1</span></span>
      <span>Passive income: <span id="passiveIncome">1</span></span>
    </div>
    <div class="progress">
      <div id="energyProgress" class="progress-bar energy-progress"></div>
    </div>
  </div>
  <div class="tap-button-container">
    <button id="tap-button"></button>
  </div>
</div>
</div>
