<div id="page-content">
  <div class="header">
    <h1>Shop</h1>
  </div>
  <div class="info-area">
    <div class="info-row">
      <span>Coins: <span id="coins">0</span></span>
      <span>Passive income: <span id="passiveIncome">1</span></span>
    </div>
  </div>
  <div id="shop-tabs">
    <button class="tab-button active" data-tab="monsters">Monsters</button>
    <button class="tab-button" data-tab="cards">Cards</button>
  </div>

  <div id="shop-content">
    <div id="monsters-container" class="tab-content active scrollable-container grid-container">
      <!-- Monster items will be dynamically inserted here -->
    </div>
    <div id="cards-container" class="tab-content scrollable-container grid-container">
      <!-- Card items will be dynamically inserted here -->
    </div>
  </div>
</div>
