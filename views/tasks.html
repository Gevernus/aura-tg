<div id="page-content">
  <div class="header">
    <h1 class="shop-header">
      <span class="shop-title">Shop</span>
    </h1>
  </div>
  <div class="info-area">
    <div class="info-row">
      <span>Coins: <span id="coins">0</span></span>
      <span>Tap power: <span id="tapPower">1</span></span>
      <span>Passive income: <span id="passiveIncome">1</span></span>
    </div>
  </div>
  <div id="shop-tabs">
    <button class="tab-button active" data-tab="active">Active</button>
    <button class="tab-button" data-tab="completed">Completed</button>
  </div>

  <div id="shop-content">
    <div id="active-container" class="tab-content active scrollable-container">
    </div>
    <div id="completed-container" class="tab-content scrollable-container">
    </div>
  </div>
</div>
