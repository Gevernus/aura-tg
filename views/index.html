<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Clicker</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding-bottom: 60px; /* Убедимся, что содержимое не перекрывает навигацию */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .nav-bottom {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: rgba(248, 249, 250, 0.9); /* Полупрозрачный фон для навигации */
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .tap-button {
      width: 100px;
      height: 100px;
      font-size: 24px;
    }
    .nav-bottom .nav-item {
      flex: 1;
      text-align: center;
    }
    .nav-bottom .nav-link {
      padding: 0;
      font-size: 12px;
    }
    .nav-bottom .nav-link i {
      display: block;
      font-size: 18px;
    }
    @media (max-width: 576px) {
      .tap-button {
        width: 80px;
        height: 80px;
        font-size: 18px;
      }
      .nav-link {
        font-size: 12px;
      }
      .nav-link i {
        font-size: 18px;
      }
      .nav-bottom .navbar-nav {
        flex-direction: row;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <!-- Bottom Navigation -->
  <nav class="navbar navbar-expand-sm bg-light navbar-light nav-bottom">
    <ul class="navbar-nav nav-justified w-100">
      <li class="nav-item">
        <a class="nav-link text-center" href="home" data-page="home">
          <i class="fas fa-home"></i><br>Home
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-center" href="inventory" data-page="inventory">
          <i class="fas fa-boxes"></i><br>Inventory
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-center" href="shop" data-page="shop">
          <i class="fas fa-shopping-cart"></i><br>Shop
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-center" href="profile" data-page="profile">
          <i class="fas fa-user"></i><br>Profile
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-center" href="tasks" data-page="tasks">
          <i class="fas fa-tasks"></i><br>Tasks
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-center" href="referrals" data-page="referrals">
          <i class="fas fa-users"></i><br>Referrals
        </a>
      </li>
    </ul>
  </nav>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
