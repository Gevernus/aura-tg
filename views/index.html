<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Aura Clicker</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div id="main">
        <div id="content" class="container mt-3">
            <!-- Dynamic content will be loaded here -->
        </div>

        <div class="button-container">
            <a class="button navigate" data-page="profile">
                <img src="/images/profile.webp" alt="Profile">
                <span>Profile</span>
            </a>
            <a class="button navigate" data-page="shop">
                <img src="/images/shop.webp" alt="Shop">
                <span>Shop</span>
            </a>
            <a class="button navigate" data-page="home">
                <img src="/images/taps.webp">
            </a>
            <a class="button navigate" data-page="tasks">
                <img src="/images/tasks.webp" alt="Tasks">
                <span>Tasks</span>
            </a>
            <a class="button navigate" data-page="roadmap">
                <img src="/images/roadMap.webp" alt="RoadMap">
                <span>RoadMap</span>
            </a>
        </div>
    </div>
    <div id="packModal" class="modal">
        <div class="modal-content">
            <h2>Pack content</h2>
            <div id="packItems">
            
            </div>
            <button class="close-btn">Claim</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script type="module" src="/systemManager.js"></script>
    <script type="module" src="/ecs.js"></script>
    <script type="module" src="/systems.js"></script>
    <script type="module" src="/components.js"></script>
    <script type="module" src="/index.js"></script>
</body>

</html>
