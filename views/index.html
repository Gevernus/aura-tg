<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Aura Clicker</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<!-- Google tag (gtag.js) -->

<script>

<body>
    <div id="loading-screen">
        <div class="loading-circle"></div>
    </div>
    <div id="main">
        <div id="content" class="container mt-3">
            <!-- Dynamic content will be loaded here -->
        </div>

        <div class="button-container">
            <div class="button navigate" data-page="profile">
                <img src="/images/profile.webp" alt="Profile">
                <span class="nav-text">Profile</span>
            </div>
            <div class="button navigate" data-page="shop">
                <img src="/images/shop.webp" alt="Shop">
                <span class="nav-text">Shop</span>
            </div>
            <div class="button navigate" data-page="home">
                <img src="/images/taps.webp">
            </div>
            <div class="button navigate" data-page="tasks">
                <img src="/images/tasks.webp" alt="Tasks">
                <span class="nav-text">Tasks</span>
            </div>
            <div class="button navigate" data-page="roadmap">
                <img src="/images/roadMap.webp" alt="RoadMap">
                <span class="nav-text">RoadMap</span>
            </div>
        </div>
    </div>
    <div id="packModal" class="modal">
        <div class="modal-content">
            <h2>Pack content</h2>
            <div id="packItems">
            
            </div>
            <button class="close-btn">Claim</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/eruda"></script> -->
    <script type="module" src="/systemManager.js"></script>
    <script type="module" src="/ecs.js"></script>
    <script type="module" src="/systems.js"></script>
    <script type="module" src="/components.js"></script>
    <script type="module" src="/index.js"></script>

</html>
