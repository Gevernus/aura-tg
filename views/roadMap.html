<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap - Aura Clicker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.5em;
    }

    .roadmap-item {
      background-color: #2a2a2a;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
    }

    .roadmap-item.done {
      background-color: #1e2732;
    }

    .roadmap-item.next {
      background-color: #0e3a5e;
    }

    .roadmap-item.future {
      background-color: #2a2a2a;
    }

    .icon {
      margin-right: 10px;
      font-size: 16px;
      flex-shrink: 0;
    }

    .done .icon {
      color: #4CAF50;
    }

    .next .icon {
      color: #2196F3;
    }

    .future .icon {
      color: #9E9E9E;
    }

    .next-label,
    .soon-label {
      margin-left: auto;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      flex-shrink: 0;
      width: 50px;
      text-align: center;
    }

    .next-label {
      background-color: #2196F3;
      color: white;
    }

    .soon-label {
      background-color: #9C27B0;
      color: white;
    }

    .item-text {
      flex-grow: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<div id="page-content">

  <div class="roadmap-item next">

  <div class="roadmap-item future">

  <div class="roadmap-item future">
